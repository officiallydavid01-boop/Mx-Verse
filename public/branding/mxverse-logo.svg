
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" fill="none">
  <defs>
    <linearGradient id="mint" x1="20" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D0FFEA"/>
      <stop offset="1" stop-color="#63DDB0"/>
    </linearGradient>
    <linearGradient id="violet" x1="20" y1="0" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C1A8FF"/>
      <stop offset="1" stop-color="#8060F5"/>
    </linearGradient>
  </defs>

  <!-- Orbital ring -->
  <ellipse cx="108" cy="105" rx="91" ry="61"
    transform="rotate(-34 108 105)"
    stroke="url(#violet)" stroke-width="5" opacity=".95"/>

  <!-- MX geometric monogram -->
  <path d="M48 145V65L91 112L134 65V145"
    stroke="url(#mint)" stroke-width="13"
    stroke-linecap="square" stroke-linejoin="bevel"/>
  <path d="M91 112L134 65"
    stroke="#A3F7D1" stroke-width="7" opacity=".35"/>

  <!-- Orbital accent -->
  <circle cx="185" cy="52" r="8" fill="#A3F7D1"/>
  <circle cx="29" cy="155" r="5" fill="#9B7BFF"/>

  <!-- Wordmark -->
  <text x="225" y="111" fill="#F2F5FA"
    font-family="Arial, Helvetica, sans-serif"
    font-size="66" font-weight="800" letter-spacing="3">MXVERSE</text>

  <!-- Descriptor -->
  <text x="230" y="151" fill="#A3F7D1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16" font-weight="700" letter-spacing="5">THE FUTMINNA SOCIAL UNIVERSE</text>

  <!-- Tagline -->
  <text x="230" y="181" fill="#8995AA"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14" letter-spacing="1.8">YOUR CAMPUS. YOUR PEOPLE. YOUR UNIVERSE.</text>
</svg>
